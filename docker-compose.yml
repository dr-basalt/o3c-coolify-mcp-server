version: '3.8'

services:
  coolify-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: o3c-coolify-mcp-server:latest
    container_name: coolify-mcp-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TRANSPORT=${TRANSPORT:-sse}
      - COOLIFY_API_URL=${COOLIFY_API_URL}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coolify-mcp.rule=Host(`${MCP_DOMAIN:-mcp.localhost}`)"
      - "traefik.http.routers.coolify-mcp.entrypoints=websecure"
      - "traefik.http.routers.coolify-mcp.tls=true"
      - "traefik.http.routers.coolify-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.coolify-mcp.loadbalancer.server.port=3000"
    networks:
      - mcp-network

  # Optional: Traefik reverse proxy for production
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    profiles:
      - with-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  traefik-letsencrypt:
