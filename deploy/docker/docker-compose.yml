version: '3.8'

services:
  coolify-mcp-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: coolify-mcp-server:latest
    container_name: coolify-mcp-server
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      NODE_ENV: production
      PORT: 3000

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    networks:
      - coolify-network

    labels:
      - "com.docker.compose.project=coolify-mcp-server"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  coolify-network:
    driver: bridge
