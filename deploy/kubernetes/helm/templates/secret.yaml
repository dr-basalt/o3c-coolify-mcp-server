apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolify-mcp-server.fullname" . }}-secrets
  labels:
    {{- include "coolify-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  COOLIFY_BASE_URL: {{ .Values.coolify.baseUrl | quote }}
  COOLIFY_API_TOKEN: {{ .Values.coolify.apiToken | quote }}
